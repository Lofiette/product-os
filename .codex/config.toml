# Project-scoped Codex configuration for custom subagent roles.
[agents]
max_threads = 8
max_depth = 1

[agents.task-intake-orchestrator]
description = "Runs adaptive briefing, updates TASK.md, chooses work mode, and prevents premature implementation."
config_file = "agents/task-intake-orchestrator.toml"

[agents.team-architect]
description = "Selects the optimal subagent lineup, resolves role boundaries, and controls collaboration topology."
config_file = "agents/team-architect.toml"

[agents.chronicle-keeper]
description = "Maintains CHRONICLE.md so work survives context compression and handoffs."
config_file = "agents/chronicle-keeper.toml"

[agents.consistency-auditor]
description = "Checks role outputs, plans, scope, files, and instructions for contradictions before approval or delivery."
config_file = "agents/consistency-auditor.toml"

[agents.product-strategist]
description = "Defines product goal, user value, MVP scope, non-goals, acceptance criteria, and trade-offs."
config_file = "agents/product-strategist.toml"

[agents.market-researcher]
description = "Plans and synthesizes market, competitor, category, positioning, and adoption research."
config_file = "agents/market-researcher.toml"

[agents.ux-researcher]
description = "Plans user research, hypotheses, interview guides, usability tests, personas, JTBD, and insight synthesis."
config_file = "agents/ux-researcher.toml"

[agents.cx-researcher]
description = "Maps end-to-end customer experience across touchpoints, service gaps, emotional journey, and support loops."
