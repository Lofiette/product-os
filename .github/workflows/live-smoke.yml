name: CPT live Codex smoke

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Read-only evaluation case
        required: true
        default: local_ignored_runtime_git_cleanliness
        type: choice
        options:
          - local_ignored_runtime_git_cleanliness
          - reference_fidelity
          - existing_product_onboarding

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install grader dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare isolated fixture
        run: >-
          python tools/cpt_eval.py prepare-external
          --case "${{ inputs.case_id }}"
          --output-dir .cpt-eval-live
      - name: Run Codex in the read-only fixture
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .cpt-eval-live/prompt.md
          output-file: .cpt-eval-live/output.json
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-home: .cpt-eval-live/home/.codex
          codex-args: '["--ephemeral","--ignore-user-config","--output-schema","${{ github.workspace }}/.cpt-eval-live/output-schema.json","-C","${{ github.workspace }}/.cpt-eval-live/workspace"]'
      - name: Grade structured output with reduced trace observability
        shell: bash
        run: >-
          python tools/cpt_eval.py grade-external
          --case "${{ inputs.case_id }}"
          --workspace .cpt-eval-live/workspace
          --output .cpt-eval-live/output.json
          --report .cpt-eval-live/graded.json
          --reduced-observability
      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpt-live-smoke-${{ inputs.case_id }}
          path: .cpt-eval-live/
          if-no-files-found: warn
