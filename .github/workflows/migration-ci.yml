name: CPT migration CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - run: python scripts/validate_migration_assets.py
      - run: python tests/test_migration.py
      - run: python tools/cpt_migrate.py platform-check --project .

  wsl:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install an ephemeral Ubuntu distribution under WSL 1
        shell: pwsh
        run: |
          wsl.exe --set-default-version 1
          wsl.exe --install --distribution Ubuntu --no-launch --web-download
          wsl.exe --list --verbose
      - name: Run migration and distribution acceptance inside WSL
        shell: pwsh
        run: |
          $drive = $env:GITHUB_WORKSPACE.Substring(0, 1).ToLowerInvariant()
          $relative = $env:GITHUB_WORKSPACE.Substring(2).Replace('\', '/')
          $workspace = "/mnt/$drive$relative"
          if (-not $workspace.StartsWith('/mnt/')) {
            throw "Unexpected WSL workspace path: $workspace"
          }

          $acceptance = @"
          set -euo pipefail
          uname -a
          cd '$workspace'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y python3 python3-venv
          python3 -m venv /tmp/product-os-venv
          /tmp/product-os-venv/bin/python -m pip install -r requirements.txt
          /tmp/product-os-venv/bin/python scripts/validate_migration_assets.py
          /tmp/product-os-venv/bin/python tests/test_migration.py
          /tmp/product-os-venv/bin/python tools/cpt_migrate.py platform-check --project .
          /tmp/product-os-venv/bin/python scripts/validate_marketplace_helpers.py
          /tmp/product-os-venv/bin/python tools/validate_distribution.py
          "@

          wsl.exe --distribution Ubuntu --user root -- bash -lc $acceptance
